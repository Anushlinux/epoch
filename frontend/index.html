<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#1d1f20" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src http://127.0.0.1:* http://localhost:*; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Epoch · Chat</title>
    <link rel="icon" href="/mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/intake.mjs"></script>
  </head>
  <body>
    <a class="skip-link" href="#workspace">Skip to workspace</a>
    <div id="intake" class="app"></div>
    <div
      id="announcement"
      class="sr-only"
      role="status"
      aria-live="polite"
    ></div>
    <dialog id="inspector" aria-labelledby="inspector-title">
      <div class="dialog-heading">
        <h2 id="inspector-title">Evidence</h2>
        <button id="close-inspector" class="icon-button" aria-label="Close">
          ✕
        </button>
      </div>
      <p id="inspector-label" class="eyebrow"></p>
      <pre id="inspector-content" tabindex="0"></pre>
      <button id="download-artifact">Download record JSON</button>
    </dialog>
    <noscript
      ><main>
        <h1>Epoch</h1>
        <p>
          Enable JavaScript to use this local workspace. Saving a request does
          not start execution.
        </p>
      </main></noscript
    >
  </body>
</html>
